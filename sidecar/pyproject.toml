[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stealth-fetch"
version = "0.1.0"
description = "Local HTTP and browser fetch sidecar for OpenClaw"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Arseniy Palagin"}]
dependencies = [
  "curl_cffi==0.15.0",
  "patchright==1.63.0",
  "camoufox[geoip]==0.5.8",
  "trafilatura==2.0.0",
  "readability-lxml==0.8.4.1",
  "lxml==6.0.2",
  "lxml_html_clean==0.4.4",
  "markdownify==1.2.2",
  "fastapi==0.135.1",
  "uvicorn==0.42.0",
  "psutil==7.2.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["stealth_fetch*"]
